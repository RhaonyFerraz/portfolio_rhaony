<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0f1d3a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="centerLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a101f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect width="400" height="480" fill="url(#centerLight)"/>

  <!-- Tech Grid Lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
  </g>

  <!-- Futuristic User Silhouette & Data nodes -->
  <circle cx="200" cy="170" r="64" fill="#13203b" stroke="url(#neonGlow)" stroke-width="2.5"/>
  <path d="M110 370 C110 270, 290 270, 290 370 Z" fill="#13203b" stroke="url(#neonGlow)" stroke-width="2.5"/>

  <!-- Glowing Nodes on head & shoulders -->
  <circle cx="200" cy="170" r="8" fill="#00f5d4"/>
  <circle cx="150" cy="310" r="5" fill="#38bdf8"/>
  <circle cx="250" cy="310" r="5" fill="#38bdf8"/>

  <!-- Constellation lines -->
  <line x1="200" y1="170" x2="150" y2="310" stroke="#00f5d4" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="170" x2="250" y2="310" stroke="#00f5d4" stroke-width="1" opacity="0.6"/>
  <line x1="150" y1="310" x2="250" y2="310" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Code/Tech Badge -->
  <g transform="translate(120, 410)">
    <rect width="160" height="34" rx="8" fill="#060911" stroke="#00f5d4" stroke-width="1" opacity="0.9"/>
    <text x="80" y="22" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">
      &lt;C_CORE::WASM /&gt;
    </text>
  </g>
</svg>
